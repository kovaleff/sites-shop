openapi: 3.1.0
info:
  title: Sites-shop — API кабинета продавца
  version: 1.0.0
  description: |
    Сессионный JSON-API SPA. Аутентификация — cookie-сессия Laravel (`web`),
    мутирующие запросы требуют заголовок `X-CSRF-TOKEN` из `<meta name="csrf-token">`.
    Ответы — camelCase; деньги — целые рубли; даты — ISO 8601.
    Ошибки: `401` гость, `404` чужая/несуществующая запись, `422` валидация,
    `500` общий текст. Формат ошибки валидации — стандартный Laravel:
    `{ message, errors: { field: [string] } }`.

servers:
  - url: /
    description: Тот же домен, что и SPA

security:
  - cookieAuth: []

tags:
  - name: catalog
    description: Публичный read-only каталог (зависимость для «Связаться»)
  - name: categories
  - name: my-sites
  - name: conversations
  - name: unread

paths:
  /api/v1/catalog:
    get:
      tags: [catalog]
      summary: Публичный список объявлений
      security: []
      parameters:
        - { name: price_min, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: price_max, in: query, schema: { type: integer, minimum: 0, default: 10000000 } }
        - { name: income_min, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: income_max, in: query, schema: { type: integer, minimum: 0, default: 1000000 } }
        - { name: zones, in: query, schema: { type: string }, description: 'CSV, например ru,com; пусто — все зоны' }
        - { name: verified, in: query, schema: { type: integer, enum: [0, 1], default: 0 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: sort, in: query, schema: { type: string, enum: [newest], default: newest } }
      responses:
        '200':
          description: Страница каталога
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicSiteList' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/catalog/zones:
    get:
      tags: [catalog]
      summary: Доменные зоны и количество публичных лотов
      security: []
      responses:
        '200':
          description: Зоны в порядке ru, com, de, затем по алфавиту
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [value, label, count]
                      properties:
                        value: { type: string, examples: [ru] }
                        label: { type: string, examples: ['.ru'] }
                        count: { type: integer, minimum: 1 }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/categories:
    get:
      tags: [categories]
      summary: Справочник тематик
      security: []
      responses:
        '200':
          description: Все тематики
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/my/sites:
    get:
      tags: [my-sites]
      summary: Объявления текущего пользователя
      parameters:
        - { name: hidden, in: query, schema: { type: integer, enum: [0, 1], default: 0 }, description: '1 — скрытые проданные' }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200':
          description: Список объявлений (25 на страницу, новые сначала)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [my-sites]
      summary: Создание объявления
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteWriteRequest' }
      responses:
        '201':
          description: Объявление создано
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Site' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/my/sites/{site}:
    parameters:
      - { name: site, in: path, required: true, schema: { type: integer } }
    get:
      tags: [my-sites]
      summary: Карточка объявления с историей платежей
      responses:
        '200':
          description: Детали
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SiteDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [my-sites]
      summary: Редактирование объявления
      description: Недоступно для статуса «Продан» (422).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteWriteRequest' }
      responses:
        '200':
          description: Обновлено
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SiteDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/my/sites/{site}/status:
    parameters:
      - { name: site, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [my-sites]
      summary: Смена статуса объявления
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, inactive, withdrawn, sold] }
      responses:
        '200':
          description: Статус изменён
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Site' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/my/sites/{site}/hide:
    parameters:
      - { name: site, in: path, required: true, schema: { type: integer } }
    post:
      tags: [my-sites]
      summary: Скрыть проданное объявление из списка кабинета
      responses:
        '200':
          description: Скрыто
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Site' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [my-sites]
      summary: Вернуть скрытое объявление в список
      responses:
        '200':
          description: Возвращено
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Site' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/conversations:
    get:
      tags: [conversations]
      summary: Диалоги пользователя (обе роли)
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200':
          description: Диалоги, новые сверху (25 на страницу)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [conversations]
      summary: Начать или продолжить переписку
      description: |
        Создаёт диалог по паре «объявление + покупатель» либо добавляет сообщение
        в существующий. Отклоняется для своего объявления, непубличного объявления
        и текста вне 1–2000 символов.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [siteId, body]
              properties:
                siteId: { type: integer }
                body: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201':
          description: Диалог создан или дополнен
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/conversations/{conversation}:
    parameters:
      - { name: conversation, in: path, required: true, schema: { type: integer } }
    get:
      tags: [conversations]
      summary: История диалога
      description: Открытие диалога помечает входящие сообщения прочитанными.
      responses:
        '200':
          description: Диалог и сообщения по возрастанию времени
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Conversation' }
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/conversations/{conversation}/messages:
    parameters:
      - { name: conversation, in: path, required: true, schema: { type: integer } }
    post:
      tags: [conversations]
      summary: Ответ в диалоге
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201':
          description: Сообщение создано
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/messages/unread:
    get:
      tags: [unread]
      summary: Количество непрочитанных по всем диалогам
      responses:
        '200':
          description: Счётчик для шапки
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthenticated' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Сессионная cookie + заголовок `X-CSRF-TOKEN`

  responses:
    Unauthenticated:
      description: Требуется вход
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorMessage' }
    NotFound:
      description: Объявление или диалог не найдены или принадлежат другому пользователю
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorMessage' }
    ValidationError:
      description: Ошибка валидации
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    ServerError:
      description: Внутренняя ошибка
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorMessage' }

  schemas:
    ErrorMessage:
      type: object
      required: [message]
      properties:
        message: { type: string }

    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    Category:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }

    StatusOption:
      type: object
      required: [value, label]
      properties:
        value: { type: string, enum: [active, inactive, withdrawn, sold] }
        label: { type: string }

    SubscriptionPayment:
      type: object
      required: [id, amount, currency, periodMonths, status, statusLabel, paidAt, createdAt]
      properties:
        id: { type: integer }
        amount: { type: integer }
        currency: { type: string, examples: [RUB] }
        periodMonths: { type: integer }
        status: { type: string, enum: [pending, paid, failed, cancelled] }
        statusLabel: { type: string }
        paidAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    Site:
      type: object
      required:
        [id, title, domain, domainZone, description, price, monthlyRevenue, hasTrademark,
         status, statusLabel, verified, verificationFilename, paidUntil, needsRenewal,
         isPubliclyVisible, soldAt, hiddenAt, categories, unreadMessages, createdAt, updatedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        domain: { type: string }
        domainZone: { type: [string, 'null'] }
        description: { type: string }
        price: { type: integer, minimum: 0 }
        monthlyRevenue: { type: integer, minimum: 0 }
        hasTrademark: { type: boolean }
        status: { type: string, enum: [active, inactive, withdrawn, sold] }
        statusLabel: { type: string }
        verified: { type: boolean }
        verificationFilename: { type: string }
        paidUntil: { type: [string, 'null'], format: date }
        needsRenewal: { type: boolean }
        isPubliclyVisible: { type: boolean }
        soldAt: { type: [string, 'null'], format: date-time }
        hiddenAt: { type: [string, 'null'], format: date-time }
        categories:
          type: array
          items: { $ref: '#/components/schemas/Category' }
        unreadMessages: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SiteDetail:
      allOf:
        - $ref: '#/components/schemas/Site'
        - type: object
          required: [payments, availableStatuses]
          properties:
            payments:
              type: array
              items: { $ref: '#/components/schemas/SubscriptionPayment' }
            availableStatuses:
              type: array
              items: { $ref: '#/components/schemas/StatusOption' }

    SiteWriteRequest:
      type: object
      required: [title, domain, description, price, monthlyRevenue, categories]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 3, maxLength: 255 }
        domain: { type: string, maxLength: 253 }
        description: { type: string, minLength: 50, maxLength: 5000 }
        price: { type: number, minimum: 0, maximum: 9999999999 }
        monthlyRevenue: { type: number, minimum: 0, maximum: 9999999999 }
        hasTrademark: { type: boolean, default: false }
        categories:
          type: array
          minItems: 1
          items: { type: integer }

    PaginationMeta:
      type: object
      required: [page, perPage, total, lastPage, from, to]
      properties:
        page: { type: integer }
        perPage: { type: integer, examples: [25] }
        total: { type: integer }
        lastPage: { type: integer }
        from: { type: [integer, 'null'] }
        to: { type: [integer, 'null'] }

    SiteList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Site' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    PublicSite:
      type: object
      required:
        [id, title, domain, domainZone, description, price, monthlyIncome, status, isVerified, faviconUrl, publishedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        domain: { type: string }
        domainZone: { type: [string, 'null'] }
        description: { type: string }
        price: { type: integer }
        monthlyIncome: { type: integer }
        status: { type: string, enum: [active] }
        isVerified: { type: boolean }
        faviconUrl: { type: [string, 'null'] }
        publishedAt: { type: string, format: date-time }

    PublicSiteList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicSite' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    ConversationSite:
      type: object
      required: [id, title, domain, status, isPubliclyVisible]
      properties:
        id: { type: integer }
        title: { type: string }
        domain: { type: string }
        status: { type: string, enum: [active, inactive, withdrawn, sold] }
        isPubliclyVisible: { type: boolean }

    Counterparty:
      type: object
      required: [id, displayName, avatarUrl]
      properties:
        id: { type: integer }
        displayName: { type: string }
        avatarUrl: { type: [string, 'null'] }

    LastMessage:
      type: object
      required: [body, createdAt, isMine]
      properties:
        body: { type: string }
        createdAt: { type: string, format: date-time }
        isMine: { type: boolean }

    Conversation:
      type: object
      required: [id, role, site, counterparty, lastMessage, unreadCount, isReadOnly, lastMessageAt]
      properties:
        id: { type: integer }
        role: { type: string, enum: [buyer, seller] }
        site: { $ref: '#/components/schemas/ConversationSite' }
        counterparty: { $ref: '#/components/schemas/Counterparty' }
        lastMessage: { oneOf: [{ $ref: '#/components/schemas/LastMessage' }, { type: 'null' }] }
        unreadCount: { type: integer, minimum: 0 }
        isReadOnly: { type: boolean }
        lastMessageAt: { type: [string, 'null'], format: date-time }

    ConversationList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Conversation' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    Message:
      type: object
      required: [id, body, isMine, createdAt, readAt]
      properties:
        id: { type: integer }
        body: { type: string }
        isMine: { type: boolean }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, 'null'], format: date-time }